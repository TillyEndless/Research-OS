<!doctype html>

<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>ResearchOS Dashboard</title>

  <link
    rel="stylesheet"
    href="/styles.css"
  />
</head>

<body>

  <header class="topbar">

    <div>
      <h1>ResearchOS</h1>

      <p>
        Persistent Research Memory
      </p>
    </div>


    <button id="refresh">
      Refresh
    </button>

  </header>


  <main>

    <section>

      <div class="section-heading">
        <h2>Current Research State</h2>
      </div>

      <div
        id="workspace"
        class="workspace-grid"
      ></div>

    </section>


    <section>

      <div class="section-heading">
        <h2>Active Hypotheses</h2>
      </div>

      <div
        id="hypotheses"
        class="cards"
      ></div>

    </section>


    <section>

      <div class="section-heading">
        <h2>Experiments</h2>
      </div>

      <div
        id="experiments"
        class="cards"
      ></div>

    </section>


    <section>

      <div class="section-heading">
        <h2>Planned Actions</h2>
      </div>

      <div
        id="actions"
        class="cards"
      ></div>

    </section>


    <section>

      <div class="section-heading">
        <h2>Recent Findings</h2>
      </div>

      <div
        id="findings"
        class="cards"
      ></div>

    </section>


    <section>

      <div class="section-heading">
        <h2>Recent Decisions</h2>
      </div>

      <div
        id="decisions"
        class="cards"
      ></div>

    </section>


    <section>

      <div class="section-heading">
        <h2>Research Roadmap</h2>
      </div>

      <div class="roadmap-layout">

        <div>

          <h3>Nodes</h3>

          <div
            id="roadmap-nodes"
            class="cards"
          ></div>

        </div>


        <div>

          <h3>Relations</h3>

          <div
            id="roadmap-edges"
            class="edges"
          ></div>

        </div>

      </div>

    </section>


    <section>

      <div class="section-heading">
        <h2>Entity Counts</h2>
      </div>

      <div
        id="counts"
        class="stats"
      ></div>

    </section>

  </main>


  <script src="/app.js"></script>

</body>
</html>
